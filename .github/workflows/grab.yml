name: grab-epg

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  actions: write # keepalive: re-enable this workflow
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy halfway; queue the next run instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub disables scheduled workflows in public repos after 60 days without repository
      # activity. Re-enabling the workflow through the API on every run keeps the schedule
      # alive without dummy commits (the approach of gautamkrishnar/keepalive-workflow).
      - name: Keep schedule alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/grab.yml/enable"

      - uses: actions/checkout@v7

      - name: Check out iptv-org/epg grabber
        uses: actions/checkout@v7
        with:
          repository: iptv-org/epg
          path: epg

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: epg/package-lock.json

      - name: Install grabber
        working-directory: epg
        run: npm ci

      - name: Grab guide
        working-directory: epg
        run: |
          npm run grab --- --channels=../belgie.channels.xml \
            --days=3 --maxConnections=2 --output=../public/guide.xml --gzip

      - name: Drop duplicate programmes
        run: |
          python3 scripts/dedupe-guide.py public/guide.xml
          gzip -9 -c public/guide.xml > public/guide.xml.gz

      # If this fails, nothing is deployed and yesterday's guide stays online.
      - name: Sanity check
        run: |
          programmes=$(grep -c '<programme' public/guide.xml)
          channels=$(grep -o '<programme [^>]*channel="[^"]*"' public/guide.xml | sed 's/.*channel="//' | sort -u | wc -l)
          echo "programmes: $programmes, channels with programmes: $channels"
          echo "### Gids: $programmes programma's op $channels zenders" >> "$GITHUB_STEP_SUMMARY"
          test -s public/guide.xml.gz
          # Full list (14/10/2026): ~28,000 programmes (after dedupe) on ~198 channels. Well below that means
          # Pickx failed for many channels; keep yesterday's guide instead.
          test "$programmes" -gt 20000
          test "$channels" -ge 150

      - name: Add channel metadata
        run: cp channels-meta.json public/channels.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
